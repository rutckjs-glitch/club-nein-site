<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB NEIN | TICKETING</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #ff0000; --bg: #050505; --card: #121212; --admin: #00ff41; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0 20px 20px 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* 추가: 모든 페이지 고정 로고 헤더 */
        .fixed-logo-header { 
            position: sticky; 
            top: 0; 
            width: 100vw; 
            background: var(--bg); 
            padding: 20px 0; 
            z-index: 2000; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 20px;
        }
        .logo-text { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: var(--neon); 
            letter-spacing: 8px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .container { background: var(--card); border: 1px solid #333; width: 100%; max-width: 450px; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        
        /* 알림 및 인증 UI */
        .header-tools { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: relative; }
        .user-info { font-size: 0.75rem; color: #888; }
        .auth-btn { background: none; border: 1px solid #444; color: #ccc; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; }
        
        .noti-bell { position: relative; cursor: pointer; font-size: 1.5rem; background: none; border: none; color: white; padding: 5px; }
        .noti-badge { position: absolute; top: 0; right: 0; background: var(--neon); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; display: none; font-weight: bold; border: 2px solid var(--bg); }
        .noti-box { position: absolute; top: 50px; right: 0; width: 300px; background: #1e1e1e; border: 1px solid #333; border-radius: 15px; display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,1); }
        .noti-header { padding: 12px 15px; border-bottom: 1px solid #333; font-weight: bold; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .noti-list { max-height: 350px; overflow-y: auto; }
        .noti-item { padding: 15px; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; line-height: 1.4; color: #ccc; }
        .noti-item.new { border-left: 4px solid var(--neon); background: #251010; }

        .nav { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 450px; flex-wrap: wrap; }
        .nav-btn { flex: 1; min-width: 80px; padding: 12px; background: #222; color: #888; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: 1px solid #444; }
        .nav-btn.active { background: var(--neon); color: white; border-color: var(--neon); }
        .nav-btn.admin-mode.active { background: var(--admin); color: black; border-color: var(--admin); }
        
        .section { display: none; }
        .section.active { display: block; }
        h1 { color: var(--neon); text-align: center; letter-spacing: 4px; margin-bottom: 20px; font-size: 1.8rem; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn { background: var(--neon); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .btn-alt { background: #333; color: white; margin-top: 5px; }
        
        .ticket-res { background: white; color: black; border-radius: 20px; padding: 25px; text-align: center; margin-top: 20px; display: none; }
        .qr-placeholder { padding: 30px; color: #ff3e3e; font-weight: bold; border: 2px dashed #ff3e3e; margin: 15px 0; border-radius: 10px; background: #fff5f5; }
        #qrArea { display: flex; justify-content: center; margin: 20px 0; min-height: 160px; }

        /* 추가: 저장 버튼 스타일 */
        .btn-save { background: #000; color: #fff; margin-top: 15px; padding: 12px; font-size: 0.85rem; display: none; }

        .admin-item { border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
        .approved-tag { background: #004411; color: #00ff41; border: 1px solid #00ff41; }
        .approve-btn { background: var(--admin); color: black; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* 마이페이지 전용 스타일 */
        .mypage-profile { text-align: center; margin-bottom: 30px; }
        .profile-img { width: 80px; height: 80px; background: linear-gradient(45deg, #333, var(--neon)); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; border: 2px solid #555; }
        .mypage-stat { display: flex; justify-content: space-around; background: #1a1a1a; padding: 15px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #333; }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 1.2rem; font-weight: bold; color: var(--neon); }
        .stat-label { font-size: 0.7rem; color: #888; }
        .mypage-menu { display: flex; flex-direction: column; gap: 10px; }
        .menu-item { background: #222; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #333; transition: 0.3s; }
        .menu-item:hover { border-color: var(--neon); background: #282828; }
        .menu-item span { font-size: 0.9rem; font-weight: bold; }
        .menu-icon { color: var(--neon); }
    </style>
</head>
<body>

    <header class="fixed-logo-header">
        <div class="logo-text">Club Nein</div>
    </header>

    <div class="header-tools">
        <div id="authStatus" class="user-info">로그인이 필요합니다</div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="logoutBtn" class="auth-btn" style="display:none;" onclick="handleLogout()">로그아웃</button>
            <button class="noti-bell" onclick="toggleNoti()">
                🔔<span id="notiBadge" class="noti-badge">0</span>
            </button>
        </div>
        
        <div id="notiBox" class="noti-box">
            <div class="noti-header">알림함 <span style="cursor:pointer; font-weight:normal; font-size:0.7rem; color:#888;" onclick="clearNoti()">전체삭제</span></div>
            <div id="notiList" class="noti-list">
                <div style="text-align:center; padding:30px; color:#666; font-size:0.85rem;">받은 알림이 없습니다.</div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button id="btn-auth" class="nav-btn active" onclick="switchTab('auth')">LOGIN</button>
        <button id="btn-order" class="nav-btn" onclick="switchTab('order')">ORDER</button>
        <button id="btn-check" class="nav-btn" onclick="switchTab('check')">TICKET</button>
        <button id="btn-mypage" class="nav-btn" onclick="switchTab('mypage')">MY PAGE</button>
        <button id="btn-admin" class="nav-btn admin-mode" onclick="switchTab('admin')" style="display:none;">ADMIN</button>
    </div>

    <div class="container">
        <div id="section-auth" class="section active">
            <h1 id="authTitle">LOGIN</h1>
            <input type="email" id="authEmail" placeholder="이메일">
            <input type="password" id="authPassword" placeholder="비밀번호">
            <button id="mainAuthBtn" class="btn" onclick="handleAuth()">로그인</button>
            <button id="toggleAuthBtn" class="btn btn-alt" onclick="toggleAuthMode()">회원가입하러 가기</button>
        </div>

        <div id="section-order" class="section">
            <h1>CLUB NEIN</h1>
            <p id="orderLoginMsg" style="text-align:center; color:#ff3e3e; font-size:0.8rem; margin-bottom:15px;">로그인 후 신청 가능합니다.</p>
            <div id="orderForm" style="display:none;">
                <select id="partySelect"><option value="">로딩 중...</option></select>
                <input type="text" id="uName" placeholder="성함 / Name">
                <input type="email" id="uEmail" placeholder="이메일 (신청 확인용)">
                <input type="number" id="uQty" value="1" min="1">
                <button class="btn" onclick="submitOrder()">TICKET REQUEST</button>
            </div>
        </div>

        <div id="section-check" class="section">
            <h2 style="text-align: center; color: var(--neon);">CHECK TICKET</h2>
            <input type="email" id="checkEmail" placeholder="신청 이메일">
            <input type="text" id="checkQRID" placeholder="QR ID (예: NEIN-XXXXX)">
            <button class="btn" onclick="findTicket()">조회하기 / SEARCH</button>
            
            <div id="ticketResult" class="ticket-res">
                <div id="captureArea">
                    <div style="font-weight: 900; border-bottom: 2px solid #ddd; padding-bottom: 8px; margin-bottom: 15px;">CLUB NEIN PASS</div>
                    <div id="resInfo" style="text-align: left; font-size: 0.85rem; line-height: 1.7;"></div>
                    <div id="qrArea"></div>
                </div>
                <div id="pendingMsg" class="qr-placeholder">승인 대기 중</div>
                <button id="btnSaveImage" class="btn btn-save" onclick="downloadTicketImage()">티켓 이미지로 저장 / SAVE IMAGE</button>
            </div>
        </div>

        <div id="section-mypage" class="section">
            <h1>MY PAGE</h1>
            <div class="mypage-profile">
                <div class="profile-img">👤</div>
                <h3 id="displayUserName" style="margin:0;">GUEST</h3>
                <p id="displayUserEmail" style="color:#888; font-size:0.8rem; margin:5px 0;">로그인이 필요합니다</p>
            </div>

            <div class="mypage-stat">
                <div class="stat-item">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">총 신청</span>
                </div>
                <div class="stat-item" style="border-left: 1px solid #333; border-right: 1px solid #333; padding: 0 20px;">
                    <span class="stat-value" id="stat-approved">0</span>
                    <span class="stat-label">승인됨</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">VIP</span>
                    <span class="stat-label">등급</span>
                </div>
            </div>

            <div class="mypage-menu">
                <div class="menu-item" onclick="switchTab('check')">
                    <span>내 티켓 보관함</span>
                    <span class="menu-icon">🎫</span>
                </div>
                <div class="menu-item" onclick="toggleNoti()">
                    <span>알림 설정 및 내역</span>
                    <span class="menu-icon">🔔</span>
                </div>
                <div class="menu-item" onclick="alert('준비 중인 기능입니다.')">
                    <span>개인정보 수정</span>
                    <span class="menu-icon">⚙️</span>
                </div>
                <button class="btn btn-alt" style="margin-top:20px; border-radius:12px;" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>

        <div id="section-admin" class="section">
            <h2 style="text-align: center; color: var(--admin);">ADMIN PANEL</h2>
            <div id="adminList">명단 로딩 중...</div>
            <button class="btn" style="background: #333; color: white; margin-top: 15px;" onclick="loadAdminList()">REFRESH</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://yyvozhlkohtclyhyigbs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dm96aGxrb2h0Y2x5aHlpZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDA1ODUsImV4cCI6MjA5MDg3NjU4NX0.2ZE1uL4CRmrCjlOTgCl0qONZE15MhqetzUqysIIq7H0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myNotifications = JSON.parse(localStorage.getItem('clubNeinInbox') || '[]');
    let authMode = 'login';
    let currentUser = null;
    let myWatchingTicketId = localStorage.getItem('watchingTicketId') || null;

    document.addEventListener('DOMContentLoaded', async () => { 
        _supabase.auth.onAuthStateChange((event, session) => {
            checkUser(session?.user);
            if (event === 'SIGNED_IN') switchTab('order');
            if (event === 'SIGNED_OUT') switchTab('auth');
        });

        const { data: { user } } = await _supabase.auth.getUser();
        checkUser(user);
        fetchParties(); 
        updateNotiUI();
        requestNotificationPermission();
        listenForApprovals();
        
        if(myWatchingTicketId) autoCheckStatus();
    });

    async function checkUser(user) {
        currentUser = user;
        if (user) {
            document.getElementById('authStatus').innerText = user.email;
            document.getElementById('displayUserEmail').innerText = user.email;
            document.getElementById('displayUserName').innerText = user.email.split('@')[0].toUpperCase();
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('orderLoginMsg').style.display = 'none';
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('uEmail').value = user.email;
            
            updateMyStats(user.id);

            if(user.email === 'rutckjs@gmail.com') {
                document.getElementById('btn-admin').style.display = 'block';
            }
        } else {
            currentUser = null;
            document.getElementById('authStatus').innerText = "로그인이 필요합니다";
            document.getElementById('displayUserEmail').innerText = "로그인이 필요합니다";
            document.getElementById('displayUserName').innerText = "GUEST";
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('orderLoginMsg').style.display = 'block';
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('btn-admin').style.display = 'none';
        }
    }

    async function updateMyStats(userId) {
        const { data, error } = await _supabase.from('registrations').select('status').eq('user_id', userId);
        if(data) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-approved').innerText = data.filter(d => d.status === 'approved').length;
        }
    }

    function listenForApprovals() {
        _supabase.channel('registrations_realtime')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'registrations' }, (payload) => {
            const updated = payload.new;
            console.log("데이터 업데이트 감지됨:", updated);

            if(currentUser && currentUser.email === 'rutckjs@gmail.com' && updated.status === 'approved') {
                addNotification("🎟️ 티켓 승인 알림", `${updated.name}님의 신청이 승인되었습니다.`);
            }
            
            if (updated.status === 'approved' && updated.qrid === myWatchingTicketId) {
                addNotification("🎉 승인 완료!", "신청하신 티켓이 승인되었습니다! 지금 QR을 확인하세요.");
                showPushNotification(updated.name, updated.qrid);
                
                if(document.getElementById('section-check').classList.contains('active')) {
                    findTicket(); 
                }
                if(currentUser) updateMyStats(currentUser.id);
            }
        }).subscribe();
    }

    async function autoCheckStatus() {
        const { data } = await _supabase.from('registrations').select('status').eq('qrid', myWatchingTicketId).single();
        if(data && data.status === 'approved') {
            if(myNotifications.length === 0) {
                addNotification("🎉 티켓 승인됨", "이미 신청하신 티켓이 승인된 상태입니다.");
            }
        }
    }

    function addNotification(title, msg) {
        myNotifications.unshift({ id: Date.now(), title, message: msg, time: new Date().toLocaleString(), isNew: true });
        localStorage.setItem('clubNeinInbox', JSON.stringify(myNotifications));
        updateNotiUI();
    }

    function updateNotiUI() {
        const listDiv = document.getElementById('notiList');
        const badge = document.getElementById('notiBadge');
        const newCount = myNotifications.filter(n => n.isNew).length;
        badge.innerText = newCount;
        badge.style.display = newCount > 0 ? 'block' : 'none';

        if (myNotifications.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#666; font-size:0.85rem;">받은 알림이 없습니다.</div>';
            return;
        }
        listDiv.innerHTML = myNotifications.map(n => `
            <div class="noti-item ${n.isNew ? 'new' : ''}">
                <b>${n.title}</b><br>${n.message}<br><small>${n.time}</small>
            </div>
        `).join('');
    }

    async function submitOrder() {
        if(!currentUser) return alert("로그인 후 이용 가능합니다.");
        const pId = document.getElementById('partySelect').value;
        const name = document.getElementById('uName').value;
        const email = document.getElementById('uEmail').value;
        const qty = parseInt(document.getElementById('uQty').value);
        if (!pId || !name || !email) return alert("정보를 모두 입력하세요.");
        const qrid = "NEIN-" + Math.random().toString(36).substr(2, 5).toUpperCase();
        
        const { error } = await _supabase.from('registrations').insert([
            { party_id: pId, name, email, qty, qrid, status: 'pending', user_id: currentUser.id }
        ]);
        
        if (!error) { 
            alert(`신청 완료! ID: ${qrid}`);
            myWatchingTicketId = qrid;
            localStorage.setItem('watchingTicketId', qrid);
            addNotification("📝 신청 완료", "티켓 신청이 접수되었습니다. 관리자 승인을 기다려주세요.");
            switchTab('check'); 
            if(currentUser) updateMyStats(currentUser.id);
        } else {
            alert("오류 발생: " + error.message);
        }
    }

    async function findTicket() {
        const emailInput = document.getElementById('checkEmail').value.trim();
        const qridInput = document.getElementById('checkQRID').value.trim().toUpperCase();
        const email = emailInput || (currentUser ? currentUser.email : "");
        const qrid = qridInput || myWatchingTicketId;

        if(!qrid) return;

        const { data } = await _supabase.from('registrations').select('*').eq('qrid', qrid);
        
        if (data && data.length > 0) {
            const ticket = data[0];
            myWatchingTicketId = ticket.qrid;
            localStorage.setItem('watchingTicketId', ticket.qrid);

            document.getElementById('ticketResult').style.display = 'block';
            document.getElementById('qrArea').innerHTML = ""; 
            const isApproved = ticket.status.toLowerCase() === 'approved';
            document.getElementById('resInfo').innerHTML = `<b>NAME:</b> ${ticket.name}<br><b>STATUS:</b> ${isApproved ? '✅ 승인완료' : '⏳ 승인대기'}`;
            
            if (isApproved) {
                document.getElementById('pendingMsg').style.display = 'none';
                document.getElementById('btnSaveImage').style.display = 'block'; 
                setTimeout(() => { new QRCode(document.getElementById('qrArea'), { text: ticket.qrid, width: 160, height: 160 }); }, 100);
            } else { 
                document.getElementById('pendingMsg').style.display = 'block'; 
                document.getElementById('btnSaveImage').style.display = 'none'; 
            }
        } else if (emailInput || qridInput) {
            alert("일치하는 정보가 없습니다.");
        }
    }

    async function handleAuth() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        if (authMode === 'login') {
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
        } else {
            const { error } = await _supabase.auth.signUp({ email, password });
            if (error) alert("가입 성공! 로그인해주세요.");
        }
    }
    function handleLogout() { _supabase.auth.signOut(); }
    function toggleAuthMode() {
        authMode = authMode === 'login' ? 'signup' : 'login';
        document.getElementById('authTitle').innerText = authMode === 'login' ? 'LOGIN' : 'SIGN UP';
        document.getElementById('mainAuthBtn').innerText = authMode === 'login' ? '로그인' : '회원가입';
    }
    function toggleNoti() {
        const box = document.getElementById('notiBox');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
        if (box.style.display === 'block') {
            myNotifications.forEach(n => n.isNew = false);
            localStorage.setItem('clubNeinInbox', JSON.stringify(myNotifications));
            updateNotiUI();
        }
    }
    function clearNoti() { if(confirm("삭제?")) { myNotifications = []; localStorage.setItem('clubNeinInbox', '[]'); updateNotiUI(); } }
    function showPushNotification(name) { if (Notification.permission === "granted") new Notification("CLUB NEIN", { body: `${name}님 티켓 승인 완료!` }); }
    function requestNotificationPermission() { if ("Notification" in window) Notification.requestPermission(); }
    
    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + tab).classList.add('active');
        document.getElementById('btn-' + (tab === 'auth' ? 'auth' : tab)).classList.add('active');
        if(tab === 'admin') loadAdminList();
    }

    async function fetchParties() {
        const { data } = await _supabase.from('events').select('*');
        if (data) {
            const sel = document.getElementById('partySelect');
            sel.innerHTML = '<option value="">선택</option>';
            data.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.title}</option>`);
        }
    }
    async function loadAdminList() {
        const { data } = await _supabase.from('registrations').select('*').order('created_at', {ascending: false});
        const listDiv = document.getElementById('adminList');
        if (data) {
            listDiv.innerHTML = data.map(item => `
                <div class="admin-item">
                    <div><b>${item.name}</b><br><small>${item.qrid}</small></div>
                    <div>${item.status === 'approved' ? '<span class="status-badge approved-tag">승인됨</span>' : `<button class="approve-btn" onclick="approveTicket('${item.id}')">승인하기</button>`}</div>
                </div>`).join('');
        }
    }
    async function approveTicket(id) { 
        await _supabase.from('registrations').update({ status: 'approved' }).eq('id', id); 
        loadAdminList(); 
    }

    async function downloadTicketImage() {
        const element = document.getElementById('captureArea');
        const saveBtn = document.getElementById('btnSaveImage');
        
        const originalText = saveBtn.innerText;
        saveBtn.innerText = "이미지 생성 중...";
        saveBtn.disabled = true;
        saveBtn.style.visibility = 'hidden';

        try {
            const canvas = await html2canvas(element, {
                backgroundColor: "#ffffff",
                scale: 3, 
                useCORS: true,
                logging: false
            });

            const imageData = canvas.toDataURL('image/png');
            const fileName = `CLUB_NEIN_TICKET_${myWatchingTicketId || 'PASS'}.png`;

            const link = document.createElement('a');
            if (typeof link.download !== 'undefined' && !/KAKAOTALK/i.test(navigator.userAgent)) {
                link.href = imageData;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                alert("갤러리 또는 파일함에 저장이 시작되었습니다.");
            } else {
                const newWindow = window.open();
                if (newWindow) {
                    newWindow.document.write(`
                        <html>
                            <body style="margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; font-family:sans-serif;">
                                <p style="margin:20px; text-align:center;">이미지를 길게 눌러 [사진 저장]을 선택하세요.</p>
                                <img src="${imageData}" style="max-width:90%; border:5px solid #fff; border-radius:10px;">
                                <button onclick="window.close()" style="margin-top:20px; padding:12px 24px; background:#ff0000; color:#fff; border:none; border-radius:8px; font-weight:bold;">돌아가기</button>
                            </body>
                        </html>
                    `);
                } else {
                    alert("팝업이 차단되었습니다. 설정에서 팝업을 허용하거나 직접 캡처해주세요.");
                }
            }
        } catch (err) {
            console.error("저장 오류:", err);
            alert("이미지 생성에 실패했습니다. 화면을 직접 캡처해주세요.");
        } finally {
            saveBtn.innerText = originalText;
            saveBtn.disabled = false;
            saveBtn.style.visibility = 'visible';
        }
    }
</script>
</body>
</html>
