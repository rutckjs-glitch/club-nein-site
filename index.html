<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB NEIN | TICKETING</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --neon: #ff0000; --bg: #050505; --card: #121212; --admin: #00ff41; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: var(--card); border: 1px solid #333; width: 100%; max-width: 450px; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; position: relative; }
        
        /* 알림 UI 추가 스타일 */
        .header-tools { width: 100%; max-width: 450px; display: flex; justify-content: flex-end; margin-bottom: 15px; position: relative; }
        .noti-bell { position: relative; cursor: pointer; font-size: 1.5rem; background: none; border: none; color: white; padding: 5px; transition: 0.3s; }
        .noti-badge { position: absolute; top: 0; right: 0; background: var(--neon); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; display: none; font-weight: bold; border: 2px solid var(--bg); }
        .noti-box { position: absolute; top: 50px; right: 0; width: 300px; background: #1e1e1e; border: 1px solid #333; border-radius: 15px; display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,1); overflow: hidden; }
        .noti-header { padding: 12px 15px; border-bottom: 1px solid #333; font-weight: bold; font-size: 0.9rem; display: flex; justify-content: space-between; background: #252525; }
        .noti-list { max-height: 350px; overflow-y: auto; }
        .noti-item { padding: 15px; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; line-height: 1.4; color: #ccc; transition: 0.2s; }
        .noti-item:hover { background: #252525; }
        .noti-item.new { border-left: 4px solid var(--neon); background: #251010; }
        .noti-time { font-size: 0.7rem; color: #666; margin-top: 5px; display: block; }

        .nav { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .nav-btn { flex: 1; padding: 12px; background: #222; color: #888; border-radius: 12px; cursor: pointer; font-size: 0.8rem; font-weight: bold; border: 1px solid #444; }
        .nav-btn.active { background: var(--neon); color: white; border-color: var(--neon); }
        .nav-btn.admin-mode.active { background: var(--admin); color: black; border-color: var(--admin); }
        .section { display: none; }
        .section.active { display: block; }
        h1 { color: var(--neon); text-align: center; letter-spacing: 4px; margin-bottom: 20px; font-size: 1.8rem; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn { background: var(--neon); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .ticket-res { background: white; color: black; border-radius: 20px; padding: 25px; text-align: center; margin-top: 20px; display: none; }
        .qr-placeholder { padding: 30px; color: #ff3e3e; font-weight: bold; border: 2px dashed #ff3e3e; margin: 15px 0; border-radius: 10px; background: #fff5f5; }
        #qrArea { display: flex; justify-content: center; margin: 20px 0; min-height: 160px; }
        .admin-item { border-bottom: 1px solid #333; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; font-weight: bold; }
        .approved-tag { background: #004411; color: #00ff41; border: 1px solid #00ff41; }
        .approve-btn { background: var(--admin); color: black; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-tools">
        <button class="noti-bell" onclick="toggleNoti()">
            🔔<span id="notiBadge" class="noti-badge">0</span>
        </button>
        <div id="notiBox" class="noti-box">
            <div class="noti-header">
                알림함 (Notifications)
                <span style="cursor:pointer; font-weight:normal; font-size:0.7rem; color:#888;" onclick="clearNoti()">전체삭제</span>
            </div>
            <div id="notiList" class="noti-list">
                <div style="text-align:center; padding:30px; color:#666; font-size:0.85rem;">받은 알림이 없습니다.</div>
            </div>
        </div>
    </div>

    <div class="nav">
        <button id="btn-order" class="nav-btn active" onclick="switchTab('order')">ORDER</button>
        <button id="btn-check" class="nav-btn" onclick="switchTab('check')">MY TICKET</button>
        <button id="btn-admin" class="nav-btn admin-mode" onclick="switchTab('admin')">ADMIN</button>
    </div>

    <div class="container">
        <div id="section-order" class="section active">
            <h1>CLUB NEIN</h1>
            <select id="partySelect"><option value="">로딩 중...</option></select>
            <input type="text" id="uName" placeholder="성함 / Name">
            <input type="email" id="uEmail" placeholder="이메일 / Email">
            <input type="number" id="uQty" value="1" min="1">
            <button class="btn" onclick="submitOrder()">TICKET REQUEST</button>
        </div>

        <div id="section-check" class="section">
            <h2 style="text-align: center; color: var(--neon);">CHECK TICKET</h2>
            <input type="email" id="checkEmail" placeholder="신청 이메일">
            <input type="text" id="checkQRID" placeholder="QR ID (예: NEIN-XXXXX)">
            <button class="btn" onclick="findTicket()">조회하기 / SEARCH</button>
            <div id="ticketResult" class="ticket-res">
                <div style="font-weight: 900; border-bottom: 2px solid #ddd; padding-bottom: 8px; margin-bottom: 15px;">CLUB NEIN PASS</div>
                <div id="resInfo" style="text-align: left; font-size: 0.85rem; line-height: 1.7;"></div>
                <div id="qrArea"></div>
                <div id="pendingMsg" class="qr-placeholder">승인 대기 중<br><small>입금 확인 후 활성화됩니다.</small></div>
            </div>
        </div>

        <div id="section-admin" class="section">
            <h2 style="text-align: center; color: var(--admin);">ADMIN PANEL</h2>
            <div id="adminList">명단 로딩 중...</div>
            <button class="btn" style="background: #333; color: white; margin-top: 15px;" onclick="loadAdminList()">REFRESH</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://yyvozhlkohtclyhyigbs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dm96aGxrb2h0Y2x5aHlpZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDA1ODUsImV4cCI6MjA5MDg3NjU4NX0.2ZE1uL4CRmrCjlOTgCl0qONZE15MhqetzUqysIIq7H0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 알림 기록 저장용 변수
    let myNotifications = JSON.parse(localStorage.getItem('clubNeinInbox') || '[]');

    document.addEventListener('DOMContentLoaded', () => { 
        fetchParties(); 
        loadAdminList();
        updateNotiUI(); // 페이지 로드 시 알림함 UI 갱신
        requestNotificationPermission();
        listenForApprovals();
    });

    // --- [새로 추가된 알림 센터 기능] ---
    function toggleNoti() {
        const box = document.getElementById('notiBox');
        const isOpen = box.style.display === 'block';
        box.style.display = isOpen ? 'none' : 'block';
        
        if (!isOpen) {
            // 알림함을 열면 '새 알림' 표시(빨간점)와 상태를 읽음처리 함
            myNotifications.forEach(n => n.isNew = false);
            localStorage.setItem('clubNeinInbox', JSON.stringify(myNotifications));
            updateNotiUI();
        }
    }

    function addNotification(title, msg) {
        const newNoti = {
            id: Date.now(),
            title: title,
            message: msg,
            time: new Date().toLocaleString(),
            isNew: true
        };
        myNotifications.unshift(newNoti); // 최신순 정렬
        localStorage.setItem('clubNeinInbox', JSON.stringify(myNotifications));
        updateNotiUI();
    }

    function updateNotiUI() {
        const listDiv = document.getElementById('notiList');
        const badge = document.getElementById('notiBadge');
        const newCount = myNotifications.filter(n => n.isNew).length;

        // 배지(빨간 숫자) 업데이트
        if (newCount > 0) {
            badge.innerText = newCount;
            badge.style.display = 'block';
        } else {
            badge.style.display = 'none';
        }

        // 목록 업데이트
        if (myNotifications.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#666; font-size:0.85rem;">받은 알림이 없습니다.</div>';
            return;
        }

        listDiv.innerHTML = myNotifications.map(n => `
            <div class="noti-item ${n.isNew ? 'new' : ''}">
                <div style="font-weight:bold; color:#fff; margin-bottom:3px;">${n.title}</div>
                <div>${n.message}</div>
                <span class="noti-time">${n.time}</span>
            </div>
        `).join('');
    }

    function clearNoti() {
        if(confirm("모든 알림 기록을 삭제하시겠습니까?")) {
            myNotifications = [];
            localStorage.setItem('clubNeinInbox', JSON.stringify(myNotifications));
            updateNotiUI();
        }
    }
    // ------------------------------------

    function requestNotificationPermission() {
        if ("Notification" in window) {
            Notification.requestPermission();
        }
    }

    function listenForApprovals() {
        _supabase
            .channel('registrations_changes')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'registrations' }, (payload) => {
                const updatedData = payload.new;
                if (updatedData.status === 'approved') {
                    // 1. 브라우저 시스템 알림 (푸시)
                    showPushNotification(updatedData.name, updatedData.qrid);
                    // 2. 쇼핑몰 스타일 내부 알림함 기록 추가
                    addNotification("🎟️ 티켓 승인 완료", `${updatedData.name}님의 신청이 승인되었습니다. MY TICKET 탭에서 QR을 확인하세요!`);
                }
            })
            .subscribe();
    }

    function showPushNotification(name, qrid) {
        if (Notification.permission === "granted") {
            new Notification("🎟️ CLUB NEIN 티켓 승인 완료!", {
                body: `${name}님, 티켓이 승인되었습니다. ID: ${qrid}를 확인하세요!`,
                icon: "https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f3ab.png"
            });
        } else {
            alert(`🎉 승인 알림: ${name}님의 티켓이 승인되었습니다!`);
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + tab).classList.add('active');
        document.getElementById('btn-' + tab).classList.add('active');
        if(tab === 'admin') loadAdminList();
    }

    async function fetchParties() {
        const { data } = await _supabase.from('events').select('*');
        if (data) {
            const sel = document.getElementById('partySelect');
            sel.innerHTML = '<option value="">선택하세요 / Select Party</option>';
            data.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.title}</option>`);
        }
    }

    async function submitOrder() {
        const pId = document.getElementById('partySelect').value;
        const name = document.getElementById('uName').value;
        const email = document.getElementById('uEmail').value;
        const qty = parseInt(document.getElementById('uQty').value);
        if (!pId || !name || !email) return alert("정보를 모두 입력하세요.");
        const qrid = "NEIN-" + Math.random().toString(36).substr(2, 5).toUpperCase();
        const { error } = await _supabase.from('registrations').insert([{ party_id: pId, name, email, qty, qrid, status: 'pending' }]);
        if (!error) { alert(`신청 완료! ID: ${qrid}`); switchTab('check'); }
    }

    async function findTicket() {
        const email = document.getElementById('checkEmail').value.trim();
        const qrid = document.getElementById('checkQRID').value.trim().toUpperCase();
        const qrArea = document.getElementById('qrArea');
        const { data } = await _supabase.from('registrations').select('*').eq('email', email).eq('qrid', qrid);
        
        if (data && data.length > 0) {
            const ticket = data[0];
            document.getElementById('ticketResult').style.display = 'block';
            qrArea.innerHTML = ""; 
            const isApproved = ticket.status.toLowerCase() === 'approved';
            document.getElementById('resInfo').innerHTML = `<b>NAME:</b> ${ticket.name}<br><b>STATUS:</b> ${isApproved ? '✅ 승인완료' : '⏳ 대기중'}`;
            if (isApproved) {
                document.getElementById('pendingMsg').style.display = 'none';
                setTimeout(() => { new QRCode(qrArea, { text: ticket.qrid, width: 160, height: 160 }); }, 100);
            } else { document.getElementById('pendingMsg').style.display = 'block'; }
        } else { alert("정보가 일치하지 않습니다."); }
    }

    async function loadAdminList() {
        const { data } = await _supabase.from('registrations').select('*').order('created_at', {ascending: false});
        const listDiv = document.getElementById('adminList');
        if (data) {
            listDiv.innerHTML = "";
            data.forEach(item => {
                const isApproved = item.status.toLowerCase() === 'approved';
                listDiv.innerHTML += `
                    <div class="admin-item">
                        <div><b>${item.name}</b><br><small>${item.qrid}</small></div>
                        <div id="btn-container-${item.id}">
                            ${isApproved ? '<span class="status-badge approved-tag">승인됨</span>' : `<button class="approve-btn" onclick="approveTicket('${item.id}')">승인하기</button>`}
                        </div>
                    </div>`;
            });
        }
    }

    async function approveTicket(id) {
        const container = document.getElementById(`btn-container-${id}`);
        const { error } = await _supabase.from('registrations').update({ status: 'approved' }).eq('id', id);
        if (!error) {
            container.innerHTML = '<span class="status-badge approved-tag">승인됨</span>';
        }
    }
</script>
</body>
</html>
