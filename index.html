<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB NEIN | TICKETING</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #ff0000; --bg: #050505; --card: #121212; --admin: #00ff41; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0 0 80px 0; display: flex; flex-direction: column; align-items: center; }
        .fixed-logo-header { position: sticky; top: 0; width: 100vw; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px); padding: 15px 0; z-index: 2000; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #1a1a1a; }
        .logo-text { font-size: 1.2rem; font-weight: 900; color: var(--neon); letter-spacing: 5px; text-transform: uppercase; }
        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; position: relative; }
        .header-tools { width: 100%; max-width: 450px; display: flex; justify-content: flex-end; align-items: center; padding: 10px 20px; box-sizing: border-box; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #000; border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; padding: 10px 0; z-index: 3000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; text-decoration: none; font-size: 0.65rem; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { color: var(--neon); text-align: left; letter-spacing: 2px; margin-bottom: 20px; font-size: 1.5rem; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn { background: var(--neon); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .btn-alt { background: #333; color: white; margin-top: 5px; }
        .feed-item { background: var(--card); border: 1px solid #222; border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        .noti-box { position: fixed; top: 60px; right: 20px; width: 300px; background: #111; border: 1px solid #333; border-radius: 15px; display: none; z-index: 4000; box-shadow: 0 10px 30px rgba(0,0,0,1); }
        .live-status-container { background: #111; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .status-input-wrapper { display: flex; gap: 10px; margin-bottom: 10px; }
        .status-input { flex: 1; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 10px; font-size: 0.85rem; }
        .status-post-btn { background: var(--neon); color: black; border: none; padding: 0 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .live-status-item { border-left: 2px solid var(--neon); padding-left: 10px; margin-bottom: 12px; font-size: 0.85rem; }
        .status-user { font-weight: bold; color: #888; font-size: 0.7rem; }
        .admin-post-form { background: #1a1a1a; border: 1px solid var(--admin); padding: 20px; border-radius: 15px; margin-bottom: 30px; display: none; }
        .media-preview { width: 100%; height: 200px; background: #000; border: 1px solid #333; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-preview img, .media-preview video { max-width: 100%; max-height: 100%; }
    </style>
</head>
<body>

    <header class="fixed-logo-header"><div class="logo-text">Club Nein</div></header>

    <div class="header-tools">
        <div id="myCashHeader" style="font-size:0.8rem; color:#ffd700; font-weight:bold; margin-right: 15px; display:none;">🪙 0</div>
        <button class="nav-item" style="position:relative;" onclick="toggleNoti()"><span class="nav-icon">🔔</span><span id="notiBadge" style="display:none; background:red; color:white; font-size:0.6rem; border-radius:50%; padding:2px 5px; position:absolute; top:5px; right:5px;">0</span></button>
    </div>

    <div id="notiBox" class="noti-box"><div style="padding: 15px; border-bottom: 1px solid #222; font-weight: bold;">Activity</div><div id="notiList" style="max-height: 300px; overflow-y: auto;"></div></div>

    <div class="container">
        <div id="section-feed" class="section active">
            <h1>Weekly Schedule</h1>
            <div class="live-status-container">
                <p id="coinGuide" style="font-size: 0.7rem; color: #888; margin-bottom: 10px;">Post your plan (Cost: 1,000 🪙)</p>
                <div class="status-input-wrapper">
                    <input type="text" id="statusInput" class="status-input" placeholder="메시지를 입력하세요">
                    <button class="status-post-btn" onclick="postLiveStatus()">POST</button>
                </div>
                <div id="liveStatusList"></div>
            </div>
            <div id="partyFeed"></div>
        </div>

        <div id="section-admin" class="section">
            <h1>Admin Panel</h1>
            <div id="adminPostForm" class="admin-post-form">
                <h3 style="color:var(--admin);">CREATE INSTA POST</h3>
                <input type="text" id="postMediaUrl" placeholder="이미지/비디오 URL" oninput="updateMediaPreview()">
                <select id="postMediaType" onchange="updateMediaPreview()"><option value="image">Image</option><option value="video">Video</option></select>
                <div class="media-preview" id="mediaPreview">미리보기</div>
                <input type="text" id="postTitle" placeholder="제목">
                <textarea id="postContent" style="width:100%; background:#000; color:white; border-radius:10px; padding:10px; border:1px solid #333;" rows="3" placeholder="내용"></textarea>
                <button class="btn" style="background:var(--admin); margin-top:10px;" onclick="createAdminPost()">POST TO FEED</button>
            </div>
            <div id="adminList"></div>
        </div>

        <div id="section-auth" class="section"><h1>Login</h1><input type="email" id="authEmail"><input type="password" id="authPassword"><button class="btn" onclick="handleAuth()">Login</button></div>
        <div id="section-mypage" class="section">
            <h3 id="displayUserName">GUEST</h3><p id="displayUserEmail"></p>
            <div style="color:#ffd700; font-weight:bold;">🪙 <span id="stat-cash">0</span></div>
            <button class="btn-alt" style="color:red;" onclick="_supabase.auth.signOut(); location.reload();">Logout</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('feed')"><span class="nav-icon">📅</span><span>Feed</span></button>
        <button id="adminTabBtn" class="nav-item" style="display:none;" onclick="switchTab('admin')"><span class="nav-icon">⚙️</span><span>Admin</span></button>
        <button class="nav-item" onclick="switchTab('mypage')"><span class="nav-icon">👤</span><span>Profile</span></button>
    </nav>

<script>
    const SUPABASE_URL = 'https://yyvozhlkohtclyhyigbs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dm96aGxrb2h0Y2x5aHlpZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDA1ODUsImV4cCI6MjA5MDg3NjU4NX0.2ZE1uL4CRmrCjlOTgCl0qONZE15MhqetzUqysIIq7H0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userCash = parseInt(localStorage.getItem('clubNeinCash') || '1000');
    let adminPosts = JSON.parse(localStorage.getItem('clubNeinAdminPosts') || '[]');

    document.addEventListener('DOMContentLoaded', async () => {
        _supabase.auth.onAuthStateChange((event, session) => { checkUser(session?.user); });
        const { data: { user } } = await _supabase.auth.getUser();
        checkUser(user);
        fetchParties();
    });

    async function checkUser(user) {
        currentUser = user;
        const isAdmin = user && user.email === 'rutckjs@gmail.com';
        
        if (user) {
            document.getElementById('displayUserEmail').innerText = user.email;
            document.getElementById('displayUserName').innerText = user.email.split('@')[0].toUpperCase();
            document.getElementById('myCashHeader').style.display = 'block';
            
            if (isAdmin) {
                document.getElementById('adminTabBtn').style.display = 'flex';
                document.getElementById('adminPostForm').style.display = 'block';
                document.getElementById('coinGuide').innerText = "ADMIN MODE: Unlimited Coins";
                document.getElementById('myCashHeader').innerText = "🪙 ∞";
                document.getElementById('stat-cash').innerText = "∞";
            } else {
                document.getElementById('adminTabBtn').style.display = 'none';
                document.getElementById('adminPostForm').style.display = 'none';
                updateCashUI();
            }
        }
    }

    function updateCashUI() {
        if (currentUser?.email === 'rutckjs@gmail.com') return;
        document.getElementById('myCashHeader').innerText = `🪙 ${userCash.toLocaleString()}`;
        document.getElementById('stat-cash').innerText = userCash.toLocaleString();
    }

    function updateMediaPreview() {
        const url = document.getElementById('postMediaUrl').value;
        const type = document.getElementById('postMediaType').value;
        const preview = document.getElementById('mediaPreview');
        if(!url) return;
        preview.innerHTML = type === 'image' ? `<img src="${url}">` : `<video src="${url}" autoplay muted loop></video>`;
    }

    function createAdminPost() {
        if (currentUser?.email !== 'rutckjs@gmail.com') return;
        const p = {
            id: Date.now(),
            mediaUrl: document.getElementById('postMediaUrl').value,
            mediaType: document.getElementById('postMediaType').value,
            title: document.getElementById('postTitle').value,
            content: document.getElementById('postContent').value,
            date: new Date().toLocaleDateString()
        };
        adminPosts.unshift(p);
        localStorage.setItem('clubNeinAdminPosts', JSON.stringify(adminPosts));
        alert("게시 완료!");
        fetchParties();
        switchTab('feed');
    }

    async function fetchParties() {
        const feed = document.getElementById('partyFeed');
        feed.innerHTML = "";
        adminPosts.forEach(p => {
            const media = p.mediaType === 'image' ? `<img src="${p.mediaUrl}" style="width:100%;">` : `<video src="${p.mediaUrl}" style="width:100%;" autoplay muted loop></video>`;
            feed.innerHTML += `<div class="feed-item"><div style="padding:10px; font-weight:bold; color:var(--admin);">ADMIN OFFICIAL</div>${media}<div style="padding:15px;"><div style="color:var(--neon); font-weight:bold;">${p.title}</div><p>${p.content}</p></div></div>`;
        });
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + tab).classList.add('active');
    }

    async function handleAuth() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
    }
</script>
</body>
</html>
