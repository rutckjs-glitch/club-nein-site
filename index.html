<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB NEIN | ADMIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #ff0000; --bg: #050505; --card: #121212; --admin: #00ff41; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 입력창 스타일 */
        input, select, textarea { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; width: 100%; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; }
        .btn { background: var(--neon); color: black; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* 관리자 전용 스타일 */
        .admin-post-form { background: #111; border: 1px solid var(--admin); padding: 20px; border-radius: 15px; margin-top: 20px; }
        .admin-fab { position: fixed; bottom: 90px; right: 20px; width: 60px; height: 60px; background: var(--admin); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 2rem; color: black; z-index: 9999; cursor: pointer; }
        .media-preview { width: 100%; height: 200px; background: #000; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #333; }
        .media-preview img, .media-preview video { max-width: 100%; max-height: 100%; }

        /* 하단 네비게이션 */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { color: #666; background: none; border: none; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
    </style>
</head>
<body>

    <div id="adminAddBtn" class="admin-fab" onclick="switchTab('admin')">+</div>

    <div class="container">
        <div id="section-feed" class="section active">
            <h1>Weekly Schedule</h1>
            <div id="partyFeed"></div>
        </div>

        <div id="section-admin" class="section">
            <h1 style="color: var(--admin);">Admin Dashboard</h1>
            <div class="admin-post-form">
                <h3>NEW POST</h3>
                <input type="text" id="postMediaUrl" placeholder="이미지/영상 URL" oninput="updateMediaPreview()">
                <select id="postMediaType" onchange="updateMediaPreview()">
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                </select>
                <div class="media-preview" id="mediaPreview">미리보기</div>
                <input type="text" id="postTitle" placeholder="제목">
                <textarea id="postContent" rows="4" placeholder="내용"></textarea>
                <button class="btn" style="background: var(--admin);" onclick="createAdminPost()">UPLOAD TO FEED</button>
            </div>
        </div>

        <div id="section-mypage" class="section">
            <h1>Profile</h1>
            <h3 id="displayUserName">GUEST</h3>
            <p id="displayUserEmail"></p>
            <p>Cash: <span id="stat-cash" style="color: gold;">0</span></p>
            <div id="adminMenu" style="display:none; border: 1px solid var(--admin); padding: 15px; border-radius: 10px; margin-top: 10px;" onclick="switchTab('admin')">
                <span style="color: var(--admin);">⚙️ 관리자 패널 이동</span>
            </div>
            <button class="btn" style="margin-top: 20px;" onclick="_supabase.auth.signOut()">Logout</button>
        </div>

        <div id="section-auth" class="section">
            <h1>Login</h1>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Password">
            <button class="btn" onclick="handleAuth()">Login / Sign Up</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('feed')">📅 Feed</button>
        <button class="nav-item" onclick="switchTab('mypage')">👤 My</button>
    </nav>

<script>
    const SUPABASE_URL = 'https://yyvozhlkohtclyhyigbs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dm96aGxrb2h0Y2x5aHlpZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDA1ODUsImV4cCI6MjA5MDg3NjU4NX0.2ZE1uL4CRmrCjlOTgCl0qONZE15MhqetzUqysIIq7H0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // 핵심: 에러 방지용 안전한 텍스트 설정 함수
    function safeSetText(id, text) {
        const el = document.getElementById(id);
        if (el) el.innerText = text;
    }

    async function checkUser(user) {
        currentUser = user;
        if (!user) {
            switchTab('auth');
            return;
        }

        const isAdmin = user.email === 'rutckjs@gmail.com';

        // 안전하게 텍스트 넣기 (에러 방지)
        safeSetText('displayUserEmail', user.email);
        safeSetText('displayUserName', user.email.split('@')[0].toUpperCase());
        
        if (isAdmin) {
            safeSetText('stat-cash', '∞ (Admin)');
            if(document.getElementById('adminAddBtn')) document.getElementById('adminAddBtn').style.display = 'flex';
            if(document.getElementById('adminMenu')) document.getElementById('adminMenu').style.display = 'block';
        } else {
            safeSetText('stat-cash', '1,000');
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('section-' + tab);
        if (target) target.classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    }

    // 초기 실행 로직
    _supabase.auth.onAuthStateChange((event, session) => {
        checkUser(session?.user);
    });

    async function createAdminPost() {
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        const url = document.getElementById('postMediaUrl').value;
        const type = document.getElementById('postMediaType').value;

        const { error } = await _supabase.from('events').insert([{
            title, content, 
            image_url: type === 'image' ? url : null,
            video_url: type === 'video' ? url : null
        }]);

        if (!error) {
            alert("게시 완료!");
            location.reload();
        }
    }

    function updateMediaPreview() {
        const url = document.getElementById('postMediaUrl').value;
        const type = document.getElementById('postMediaType').value;
        const preview = document.getElementById('mediaPreview');
        if(!url) return;
        preview.innerHTML = type === 'image' ? `<img src="${url}">` : `<video src="${url}" autoplay muted loop></video>`;
    }

    async function handleAuth() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const { error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) await _supabase.auth.signUp({ email, password });
    }
</script>
</body>
</html>
