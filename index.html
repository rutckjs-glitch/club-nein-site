<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB NEIN | TICKETING</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #ff0000; --bg: #050505; --card: #121212; --admin: #00ff41; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 0 0 80px 0; display: flex; flex-direction: column; align-items: center; }
        
        .fixed-logo-header { 
            position: sticky; top: 0; width: 100vw; background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(10px);
            padding: 15px 0; z-index: 2000; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #1a1a1a;
        }
        .logo-text { font-size: 1.2rem; font-weight: 900; color: var(--neon); letter-spacing: 5px; text-transform: uppercase; }

        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; position: relative; }
        
        .header-tools { width: 100%; max-width: 450px; display: flex; justify-content: flex-end; align-items: center; padding: 10px 20px; box-sizing: border-box; }
        
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #000; border-top: 1px solid #1a1a1a;
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 3000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: #666; text-decoration: none;
            font-size: 0.65rem; background: none; border: none; cursor: pointer;
        }
        .nav-item.active { color: var(--neon); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 4px; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { color: var(--neon); text-align: left; letter-spacing: 2px; margin-bottom: 20px; font-size: 1.5rem; }
        input, select { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; }
        .btn { background: var(--neon); color: #000; border: none; padding: 16px; width: 100%; border-radius: 12px; font-weight: 800; cursor: pointer; }
        
        .live-status-container { background: #111; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .status-input-wrapper { display: flex; gap: 10px; margin-bottom: 10px; }
        .status-input { flex: 1; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 10px; font-size: 0.85rem; }
        .status-post-btn { background: var(--neon); color: black; border: none; padding: 0 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .live-status-item { border-left: 2px solid var(--neon); padding-left: 10px; margin-bottom: 12px; font-size: 0.85rem; }
        .status-user { font-weight: bold; color: #888; font-size: 0.7rem; }
        .status-text { margin-top: 3px; color: #eee; }

        .admin-post-form { background: #1a1a1a; border: 1px solid var(--admin); padding: 20px; border-radius: 15px; margin-bottom: 30px; display: none; }
        .admin-fab {
            position: fixed; bottom: 90px; right: 20px; width: 56px; height: 56px; background: var(--admin);
            border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 2rem; color: black; z-index: 4000;
        }
    </style>
</head>
<body>

    <header class="fixed-logo-header">
        <div class="logo-text">Club Nein</div>
    </header>

    <div class="header-tools">
        <div id="myCashHeader" style="font-size:0.8rem; color:#ffd700; font-weight:bold; margin-right: 15px; display:none;">🪙 0</div>
        <button class="nav-item" style="position:relative;" onclick="toggleNoti()">
            <span class="nav-icon" style="font-size: 1.2rem;">🔔</span>
            <span id="notiBadge" class="noti-badge" style="display:none;">0</span>
        </button>
    </div>

    <div id="notiBox" class="noti-box">
        <div style="padding: 15px; border-bottom: 1px solid #222; font-weight: bold; display: flex; justify-content: space-between;">
            Activity <span onclick="clearNoti()" style="font-size:0.7rem; font-weight:normal; color:#888;">Clear All</span>
        </div>
        <div id="notiList" style="max-height: 300px; overflow-y: auto;"></div>
    </div>

    <div id="adminAddBtn" class="admin-fab" onclick="switchTab('admin')">+</div>

    <div class="container">
        <div id="section-feed" class="section active">
            <h1 id="feedTitle">Weekly Schedule</h1>
            <div class="live-status-container">
                <p id="statusGuidance" style="font-size: 0.7rem; color: #888; margin-bottom: 10px;">Post your plan (Cost: 1,000 🪙)</p>
                <div class="status-input-wrapper">
                    <input type="text" id="statusInput" class="status-input" placeholder="금요일에 클럽나인 갈 사람?">
                    <button class="status-post-btn" onclick="postLiveStatus()">POST</button>
                </div>
                <div id="liveStatusList"></div>
            </div>
            <div id="partyFeed" class="feed-container"></div>
        </div>
        </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('feed')"><span class="nav-icon">📅</span><span>Schedule</span></button>
        <button class="nav-item" onclick="switchTab('match')"><span class="nav-icon">🌍</span><span>Global</span></button>
        <button class="nav-item" onclick="switchTab('shop')"><span class="nav-icon">🛍️</span><span>Shop</span></button>
        <button class="nav-item" onclick="switchTab('mypage')"><span class="nav-icon">👤</span><span>Profile</span></button>
    </nav>

<script>
    const SUPABASE_URL = 'https://yyvozhlkohtclyhyigbs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dm96aGxrb2h0Y2x5aHlpZ2JzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDA1ODUsImV4cCI6MjA5MDg3NjU4NX0.2ZE1uL4CRmrCjlOTgCl0qONZE15MhqetzUqysIIq7H0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userCash = parseInt(localStorage.getItem('clubNeinCash') || '1000'); 
    let liveStatuses = JSON.parse(localStorage.getItem('clubNeinStatuses') || '[]');
    let adminPosts = JSON.parse(localStorage.getItem('clubNeinAdminPosts') || '[]');
    let globalChannel = null;

    document.addEventListener('DOMContentLoaded', async () => { 
        _supabase.auth.onAuthStateChange((event, session) => {
            checkUser(session?.user);
            if (event === 'SIGNED_IN') switchTab('feed');
            if (event === 'SIGNED_OUT') switchTab('auth');
        });
        
        const { data: { user } } = await _supabase.auth.getUser();
        if(user) checkUser(user); else switchTab('auth');

        // --- 실시간 채널 설정 보강 ---
        globalChannel = _supabase.channel('global_feed', {
            config: {
                broadcast: { self: true } // 내가 보낸 것도 나에게 다시 오게 함 (동기화 용이)
            }
        });

        globalChannel
            .on('broadcast', { event: 'new_message' }, ({ payload }) => {
                // 중복 체크 (이미 리스트에 있는 ID면 추가 안함)
                if (!liveStatuses.some(s => s.msgId === payload.msgId)) {
                    liveStatuses.unshift(payload);
                    if (liveStatuses.length > 50) liveStatuses.pop();
                    localStorage.setItem('clubNeinStatuses', JSON.stringify(liveStatuses));
                    renderLiveStatuses();
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('CONNECTED TO REALTIME FEED');
                }
            });

        renderLiveStatuses();
    });

    async function postLiveStatus() {
        if(!currentUser) return switchTab('auth');
        const input = document.getElementById('statusInput');
        const text = input.value.trim();
        if(text === "") return;
        
        const isAdmin = currentUser.email === 'rutckjs@gmail.com';
        if(!isAdmin && userCash < 1000) return alert("코인이 부족합니다!");
        
        if(!isAdmin) {
            userCash -= 1000;
            localStorage.setItem('clubNeinCash', userCash);
        }

        const newStatus = {
            msgId: Date.now() + Math.random().toString(36).substr(2, 9), // 고유 아이디 생성
            user: currentUser.email.split('@')[0].toUpperCase(),
            text: text,
            time: new Date().getTime(),
            type: isAdmin ? 'ADMIN_POST' : 'USER_POST'
        };

        // 브로드캐스트 전송 (구독 중인 모든 사용자에게 전달됨)
        globalChannel.send({
            type: 'broadcast',
            event: 'new_message',
            payload: newStatus
        });
        
        input.value = "";
        updateCashUI();
    }

    function renderLiveStatuses() {
        const list = document.getElementById('liveStatusList');
        list.innerHTML = liveStatuses.map(s => `
            <div class="live-status-item" style="${s.type === 'ADMIN_POST' ? 'border-color: var(--admin); background: rgba(0, 255, 65, 0.05);' : ''}">
                <div class="status-user">${s.type === 'ADMIN_POST' ? '📢 ADMIN' : s.user}</div>
                <div class="status-text">${s.text}</div>
            </div>
        `).join('') || '<div style="color:#444; font-size:0.75rem;">첫 번째 소식을 남겨보세요!</div>';
    }

    // ... (나머지 handleAuth, checkUser, updateCashUI 등 기존 함수들 유지) ...

    async function checkUser(user) {
        currentUser = user;
        const isAdmin = user && user.email === 'rutckjs@gmail.com';
        if (user) {
            document.getElementById('myCashHeader').style.display = 'block';
            if(isAdmin) {
                document.getElementById('adminAddBtn').style.display = 'flex';
                document.getElementById('myCashHeader').innerText = "🪙 ∞";
            } else {
                updateCashUI();
            }
        }
    }

    function updateCashUI() {
        if(currentUser?.email === 'rutckjs@gmail.com') return;
        document.getElementById('myCashHeader').innerText = `🪙 ${userCash.toLocaleString()}`;
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById('section-' + tab);
        if(target) target.classList.add('active');
    }
</script>
</body>
</html>
